<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biohumfarma | Shop</title>
    <meta
      name="description"
      content="Landing page Biohumfarma com vitrine de produtos e links rápidos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="bio-card" aria-label="Biohumfarma shop">
        <header class="hero">
          <div class="logo-wrap">
            <img
              id="brandLogo"
              class="brand-logo"
              src="assets/logo-biohumfarma.png"
              alt="Logo da Biohumfarma"
            />
            <div id="logoFallback" class="logo-fallback" hidden>Biohumfarma</div>
          </div>

          <div class="hero-copy">
            <p class="eyebrow">Seleção Biohumfarma</p>
            <h1 id="pageTitle">Biohumfarma</h1>
            <p id="pageSubtitle" class="subtitle">
              Suplementos selecionados para sua rotina
            </p>
          </div>

          <nav class="social-links" aria-label="Links sociais">
            <a id="instagramLink" class="social-link" href="#" target="_blank" rel="noreferrer" aria-label="Instagram">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2Zm5 2.3A5.5 5.5 0 1 1 6.5 12 5.5 5.5 0 0 1 12 6.5Zm0 2.2a3.3 3.3 0 1 0 3.3 3.3A3.3 3.3 0 0 0 12 8.7Zm5.9-3.7a1.3 1.3 0 1 1-1.3 1.3 1.3 1.3 0 0 1 1.3-1.3Z" />
                </svg>
              </span>
              <span>Instagram</span>
            </a>
            <a id="whatsappLink" class="social-link" href="#" target="_blank" rel="noreferrer" aria-label="WhatsApp">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M19.1 4.9A9.94 9.94 0 0 0 3.5 17.1L2 22l5-1.5A10 10 0 1 0 19.1 4.9ZM12 20a7.9 7.9 0 0 1-4-.9l-.3-.2-2.9.9.9-2.8-.2-.3A8 8 0 1 1 12 20Zm4.4-5.9c-.2-.1-1.3-.7-1.5-.8s-.4-.1-.6.1-.7.8-.8.9-.3.2-.5.1A6.4 6.4 0 0 1 9.8 12a7.1 7.1 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4a1.5 1.5 0 0 0 .3-.5.5.5 0 0 0 0-.5c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.8.4 3.3 3.3 0 0 0-1 2.4 5.8 5.8 0 0 0 1.2 3.1A13.2 13.2 0 0 0 12 17a6.8 6.8 0 0 0 2.3.7 2.9 2.9 0 0 0 2-.6 2.5 2.5 0 0 0 .8-1.7c0-.1-.1-.2-.3-.3Z" />
                </svg>
              </span>
              <span>WhatsApp</span>
            </a>
            <a id="siteLink" class="social-link" href="#" target="_blank" rel="noreferrer" aria-label="Site">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.9 9h-3.2a15.3 15.3 0 0 0-1.2-5A8.1 8.1 0 0 1 18.9 11ZM12 4.1c.9 1 1.8 3.2 2.2 6.9H9.8C10.2 7.3 11.1 5.1 12 4.1ZM9.5 6a15.3 15.3 0 0 0-1.2 5H5.1A8.1 8.1 0 0 1 9.5 6ZM5.1 13h3.2a15.3 15.3 0 0 0 1.2 5A8.1 8.1 0 0 1 5.1 13Zm6.9 6.9c-.9-1-1.8-3.2-2.2-6.9h4.4c-.4 3.7-1.3 5.9-2.2 6.9Zm2.5-1.9a15.3 15.3 0 0 0 1.2-5h3.2a8.1 8.1 0 0 1-4.4 5Z" />
                </svg>
              </span>
              <span>Site</span>
            </a>
          </nav>
        </header>

        <section class="catalog-nav" aria-label="Navegação da vitrine">
          <button class="nav-pill" type="button">Links</button>
          <button class="nav-pill is-active" type="button" aria-current="page">Shop</button>
        </section>

        <section class="shop-section">
          <div class="section-heading">
            <p class="section-kicker">Shop ativo</p>
            <h2>Produtos em destaque</h2>
          </div>
          <div id="productGrid" class="product-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <template id="productCardTemplate">
      <article class="product-card">
        <a class="product-link" target="_blank" rel="noreferrer">
          <div class="product-media">
            <img class="product-image" alt="" loading="lazy" />
            <div class="image-placeholder" hidden>
              <span>Imagem do produto</span>
            </div>
          </div>
          <div class="product-copy">
            <div>
              <p class="product-label">Biohumfarma</p>
              <h3 class="product-name"></h3>
            </div>
            <div class="product-footer">
              <span class="product-price"></span>
              <span class="product-cta">Ver produto</span>
            </div>
          </div>
        </a>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
